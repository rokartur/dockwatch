[package]
name = "dockwatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI for Docker and Docker Compose"

[dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
